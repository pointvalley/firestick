<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#06080f"><meta name="mobile-web-app-capable" content="yes"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<style>html,body{margin:0;background:#000}.tv-gear{position:absolute;right:56px;top:84px;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:5px 12px;border-radius:20px;background:rgba(255,255,255,.1);opacity:.55;transition:all .14s}
.tv-stage.has-ticker .tv-gear{top:106px}
.tv-gear.focus{opacity:1;background:var(--accent);box-shadow:0 0 0 3px #fff,0 0 18px var(--accent);transform:scale(1.08)}
.tv-panel{position:absolute;right:40px;top:120px;width:470px;background:rgba(10,12,20,.94);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:18px 0 12px;z-index:10;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.tv-panel h4{margin:0 24px 10px;font-size:15px;letter-spacing:1.5px;text-transform:uppercase;opacity:.6}
.tv-opt{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;font-size:18px}
.tv-opt.sel{background:rgba(255,255,255,.1);box-shadow:inset 4px 0 0 var(--accent)}
.tv-opt .v{font-weight:600;display:flex;align-items:center;gap:10px}
.tv-opt.sel .v:before{content:'\25C0';font-size:12px;opacity:.6}.tv-opt.sel .v:after{content:'\25B6';font-size:12px;opacity:.6}
.tv-opt.act.sel .v:before,.tv-opt.act.sel .v:after{content:none}
.tv-sw{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid #fff}
.tv-panel p{margin:10px 24px 0;font-size:13px;opacity:.5}
.tv-ticker{position:absolute;left:0;right:0;top:0;height:40px;display:flex;align-items:stretch;background:linear-gradient(180deg,rgba(8,10,16,.92),rgba(8,10,16,.78));border-bottom:2px solid var(--accent);overflow:hidden;z-index:3;font-size:17px}
.tv-tk-tag{flex:0 0 auto;display:flex;align-items:center;padding:0 18px 0 56px;background:var(--accent);color:#fff;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;font-size:14px;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%);padding-right:30px}
.tv-tk-tag b{font-weight:300;margin-left:10px;letter-spacing:0;font-variant-numeric:tabular-nums;font-size:16px}
.tv-tk-win{position:relative;flex:1;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 40px,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(90deg,transparent,#000 40px,#000 calc(100% - 40px),transparent)}
.tv-tk-run{position:absolute;left:0;top:0;bottom:0;display:flex;align-items:center;white-space:nowrap;will-change:transform;animation:tvtick linear infinite}
.tv-tk-it{display:inline-flex;align-items:center;padding:0 22px}
.tv-tk-it i{font-style:normal;font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent);filter:brightness(1.6);margin-right:10px}
.tv-tk-it+.tv-tk-it:before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);margin:0 22px 0 -22px;opacity:.8}
@keyframes tvtick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tv-stage.has-ticker .tv-top{padding-top:56px}
.tv-stage.has-ticker .tv-rows{top:146px}
.tv-vid,.tv-wall video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}

.tv-stage{position:relative;width:1280px;height:720px;overflow:hidden;color:#fff;font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;transform-origin:0 0;user-select:none}
.tv-bg-midnight{background:radial-gradient(1200px 600px at 15% -10%,#1e3160 0%,#0b1020 55%,#06080f 100%)}
.tv-bg-graphite{background:linear-gradient(160deg,#2b2e33,#121316 70%)}
.tv-bg-aurora{background:radial-gradient(900px 500px at 85% -5%,#0f5a4c 0%,#0a1a1d 55%,#05090b 100%)}
.tv-bg-ember{background:radial-gradient(900px 500px at 10% -10%,#5a2412 0%,#1a0d0a 55%,#090506 100%)}
.tv-glow{transition:background .7s;position:absolute;right:-200px;bottom:-300px;width:760px;height:520px;background:radial-gradient(closest-side,var(--accent),transparent);opacity:.2;pointer-events:none}
.tv-wall{position:absolute;inset:0;opacity:0;transition:opacity .7s ease;pointer-events:none}
.tv-wall.on{opacity:1}
.tv-kind~.tv-badge{top:34px}
.tv-kind{position:absolute;right:10px;top:10px;font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:3px 6px;border-radius:5px;background:rgba(0,0,0,.38)}
.tv-fx,.tv-drift{position:absolute;pointer-events:none}
.tv-fx{inset:0;width:100%;height:100%}
.tv-drift{inset:-25%;background:radial-gradient(circle at 30% 35%,var(--accent),transparent 32%),radial-gradient(circle at 72% 62%,#8b5cf6,transparent 28%),radial-gradient(circle at 55% 20%,#14b8a6,transparent 25%);opacity:.22;animation:tvdrift 26s ease-in-out infinite alternate}
@keyframes tvdrift{0%{transform:translate(-8%,-5%) rotate(0deg)}100%{transform:translate(8%,6%) rotate(22deg)}}
.tv-top{position:relative;display:flex;justify-content:space-between;align-items:flex-start;padding:34px 56px 18px}
.tv-title{font-size:34px;font-weight:700;letter-spacing:-.5px}
.tv-date{font-size:16px;opacity:.65;margin-top:4px}
.tv-clock{font-size:34px;font-weight:300;font-variant-numeric:tabular-nums}
.tv-widgets{position:relative;display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:18px;padding:0 56px}
.tv-w{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px 18px;height:104px;box-sizing:border-box;overflow:hidden}
.tv-wl{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;opacity:.6;margin-bottom:6px;color:var(--accent);filter:brightness(1.6)}
.tv-wi{font-size:16px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv-big{font-size:22px;font-weight:600;line-height:1.25}
.tv-stage .dim{opacity:.5}
.tv-rows{position:absolute;left:0;right:0;top:248px;bottom:34px;overflow:hidden;scroll-behavior:smooth}
.tv-rows.nowidgets{top:120px}
.tv-rows.scrolled{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 70px);mask-image:linear-gradient(to bottom,transparent 0,#000 70px)}
.tv-row{position:relative}
.tv-row h3{margin:0 56px -4px;font-size:19px;font-weight:600;opacity:.92;display:flex;align-items:center;gap:10px}
.tv-track{position:relative;display:flex;gap:22px;padding:22px 56px 24px;overflow:hidden;scroll-behavior:smooth}
.tv-tile{position:relative;flex:0 0 var(--tw);height:calc(var(--tw) * 9 / 16);border-radius:14px;color:#fff;text-decoration:none;display:flex;align-items:flex-end;padding:12px 14px;box-sizing:border-box;box-shadow:0 6px 18px rgba(0,0,0,.35);transition:transform .14s ease,box-shadow .14s ease;outline:none;cursor:pointer}
.tv-tile.focus{transform:scale(1.09);box-shadow:0 0 0 4px #fff,0 0 22px 2px var(--accent);z-index:2}
.tv-mono{position:absolute;top:6px;left:14px;font-size:46px;font-weight:800;opacity:.33}
.tv-label{font-size:18px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv-badge{position:absolute;top:9px;right:9px;font-size:11px;font-weight:800;letter-spacing:.8px;padding:3px 7px;border-radius:6px;color:#111}
.tv-row h3 .tv-badge{position:static}
.tv-badge.new{background:#ffd54a}.tv-badge.edited{background:#8fd8ff}
.tv-empty{opacity:.4;font-size:15px;padding:20px 0}
.tv-hint{position:absolute;bottom:10px;right:56px;font-size:13px;opacity:.4}
.tv-root{position:fixed;inset:0;background:#000;overflow:hidden}
.tv-root .tv-stage{position:absolute;left:0;top:0}

/* ---- phone layout (narrow or portrait screens); TV/desktop layout above is untouched ---- */
.tv-root.tv-phone{overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch}
.tv-phone .tv-stage{position:relative;width:100%;height:auto;min-height:100%;overflow:visible;transform:none!important;padding-bottom:28px;box-sizing:border-box}
.tv-phone .tv-vid,.tv-phone .tv-wall,.tv-phone .tv-fx,.tv-phone .tv-drift,.tv-phone .tv-glow{position:fixed}
.tv-phone .tv-top{padding:20px 16px 12px}
.tv-phone .tv-title{font-size:26px}.tv-phone .tv-clock{font-size:22px;margin-top:4px}.tv-phone .tv-date{font-size:14px}
.tv-phone .tv-stage .tv-gear{top:66px;right:16px;min-height:44px;min-width:44px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:14px;opacity:.85}
.tv-phone .tv-stage.has-ticker{padding-top:40px}
.tv-phone .tv-stage.has-ticker .tv-top{padding-top:20px}
.tv-phone .tv-stage.has-ticker .tv-gear{top:106px}
.tv-phone .tv-ticker{position:fixed;font-size:15px}
.tv-phone .tv-tk-tag{padding-left:14px}
.tv-phone .tv-widgets{grid-template-columns:1fr;gap:10px;padding:4px 16px 0}
.tv-phone .tv-w{height:auto;min-height:0}
.tv-phone .tv-rows,.tv-phone .tv-rows.nowidgets,.tv-phone .tv-stage.has-ticker .tv-rows{position:static;overflow:visible;top:auto}
.tv-phone .tv-rows.scrolled{-webkit-mask-image:none;mask-image:none}
.tv-phone .tv-row h3{margin:20px 16px 0;font-size:18px}
.tv-phone .tv-track{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;padding:12px 16px 4px;overflow:visible}
.tv-phone .tv-tile{flex:none;width:auto;height:auto;aspect-ratio:16/9;min-height:72px}
.tv-phone .tv-tile.focus{transform:scale(1.03)}
.tv-phone .tv-mono{font-size:34px}.tv-phone .tv-label{font-size:16px}
.tv-phone .tv-hint{display:none}

/* ---- touch & long-press menu ---- */
.tv-root{-webkit-tap-highlight-color:transparent}
.tv-tile,.tv-gear{-webkit-touch-callout:none;-webkit-user-drag:none}
.tv-root:not(.tv-phone) .tv-stage{touch-action:none}
.tv-phone .tv-tile,.tv-phone .tv-gear{touch-action:manipulation}
.tv-root.tv-phone{scroll-snap-type:y proximity}
.tv-phone .tv-row{scroll-snap-align:start;scroll-margin-top:52px}
.tv-phone .tv-stage{scroll-snap-align:start}
.tv-gear{z-index:4;cursor:pointer}
.tv-menu-bg{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.35)}
.tv-menu{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:380px;background:rgba(10,12,20,.96);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:16px 0 10px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.tv-menu h4{margin:0 22px 8px;font-size:15px;letter-spacing:1px;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv-mi{padding:12px 22px;font-size:18px;min-height:44px;box-sizing:border-box;display:flex;align-items:center;cursor:pointer}
.tv-mi.sel{background:rgba(255,255,255,.1);box-shadow:inset 4px 0 0 var(--accent)}
.tv-phone .tv-menu-bg{position:fixed}
.tv-phone .tv-menu{top:auto;bottom:0;left:0;right:0;width:auto;transform:none;border-radius:18px 18px 0 0;padding-bottom:max(12px,env(safe-area-inset-bottom))}
.tv-toast{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(10,12,20,.94);border:1px solid rgba(255,255,255,.15);padding:10px 18px;border-radius:12px;font-size:16px;z-index:30;pointer-events:none}
.tv-phone .tv-toast{position:fixed;bottom:24px;max-width:85vw;text-align:center}

/* ---- outside the Firestick app: tiles that can only launch an installed app ---- */
.tv-tile.tv-off{filter:grayscale(.85) brightness(.6)}
.tv-tile.tv-off .tv-kind{background:rgba(0,0,0,.6)}

/* ---- Theme panel by touch; TV look unchanged (buttons only appear on touch screens) ---- */
.tv-ar{display:none}
.tv-opt .vt{display:contents}
.tv-hint-touch{display:none}
.tv-opt{cursor:pointer}
@media (any-pointer:coarse){
  .tv-ar{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:10px;background:rgba(255,255,255,.08);font-size:13px;cursor:pointer}
  .tv-opt .v{gap:6px}
  .tv-opt .vt{min-width:104px;text-align:center;display:inline-flex;justify-content:center}
  .tv-opt.sel .v:before,.tv-opt.sel .v:after{content:none}
  .tv-opt{min-height:52px;padding-top:4px;padding-bottom:4px;box-sizing:border-box}
  .tv-hint-remote{display:none}.tv-hint-touch{display:block}
}
.tv-phone .tv-panel{background:#0b0d16;box-shadow:0 -12px 40px rgba(0,0,0,.7),0 0 0 100vmax rgba(0,0,0,.45);position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;border-radius:18px 18px 0 0;max-height:85vh;overflow-y:auto;padding-bottom:max(12px,env(safe-area-inset-bottom));z-index:25}
.tv-phone .tv-opt{padding-left:18px;padding-right:12px;font-size:17px}
</style></head>
<body><div class="tv-root" id="tvroot"></div>
<script>
(function(){
var SIZES={small:200,medium:248,large:300};
var BGS=['midnight','graphite','aurora','ember'];var FX=['none','drift','snow','stars'];var KINDS=['web','app','deeplink'];
var WALLS={rink:{name:'Ice rink',accent:'#38bdf8',bg:'radial-gradient(ellipse 120% 90% at 50% 125%,#e6f6ff 0%,#7cc0ea 22%,#1d5a8a 48%,#0a1f33 78%)'},
  night:{name:'Night sky',accent:'#a78bfa',bg:'radial-gradient(1000px 560px at 75% -10%,#4c2a8c 0%,#1a0f33 50%,#07050d 100%)'},
  sunset:{name:'Sunset',accent:'#fb923c',bg:'radial-gradient(1000px 560px at 85% -10%,#ff8a4c 0%,#7a2445 38%,#1a0a16 75%)'},
  forest:{name:'Forest',accent:'#4ade80',bg:'radial-gradient(1000px 560px at 15% -10%,#2f7d4f 0%,#0f2a1c 50%,#050d08 100%)'}};
var VID='https://pointvalley.github.io/firestick/wallpapers/';
var VIDS=[['v-rain','Rain','Rain','#93c5fd'],['v-fluids','Fluids','Fluids','#e879f9'],['v-tunnel','Music Tunnel','Music Tunnel','#a855f7'],['v-matrix','Matrix Rain','Matrix Rain','#22c55e'],['v-hill','The Hill','The Hill','#d4d4d8'],['v-tri','Triangles and Light','Triangles & Light','#a3a3a3'],['v-drift','Colour Drift','Colour Drift','#f472b6'],['v-rinksnow','Ice Rink Snow','Ice Rink Snow','#38bdf8'],['v-midsnow','Midnight Snow','Midnight Snow','#93c5fd'],['v-stars','Starfield','Starfield','#c4b5fd'],['v-cityrain','City Rain','City Rain','#38bdf8'],['v-space','Infinite Space','Infinite Space','#94a3b8'],['v-medusae','Medusae','Medusae','#c084fc'],['v-lake','Mountain Lake Sunset','Mountain Lake Sunset','#fb923c'],['v-tron','Tron Grid','Tron Grid','#22d3ee'],['v-forest','Winter Forest Road','Winter Forest Road','#cbd5e1']];
VIDS.forEach(function(v){var f=VID+encodeURIComponent(v[1]);WALLS[v[0]]={name:'Video: '+v[2],accent:v[3],video:f+'.mp4',poster:f+'.png',bg:'#000 url("'+f+'.png") center/cover'};FX.push(v[0])});
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function hex(h,d){return /^#[0-9a-fA-F]{6}$/.test(h||'')?h:d}
function shade(h,a){var n=parseInt(hex(h,'#555555').slice(1),16);var f=function(v){return Math.max(0,Math.min(255,Math.round(v*(1+a))))};return 'rgb('+f(n>>16&255)+','+f(n>>8&255)+','+f(n&255)+')'}
function safeUrl(u){u=String(u||'').trim();if(!u)return '#';if(!/^https?:\/\//i.test(u))u='https://'+u.replace(/^[a-z]+:/i,'');return u}
function timeStr(){return new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
function dateStr(){return new Date().toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'})}
function uid(){return Math.random().toString(36).slice(2,9)}
function normalize(c){
  c=c&&typeof c==='object'?c:{};
  var w=c.widgets||{};
  return {title:String(c.title||'Home'),accent:hex(c.accent,'#4f8cff'),bg:BGS.indexOf(c.bg)>=0?c.bg:'midnight',
    size:SIZES[c.size]?c.size:'medium',fx:FX.indexOf(c.fx)>=0?c.fx:'none',matchAccent:!!c.matchAccent,showWidgets:c.showWidgets!==false,widgetStyle:c.widgetStyle==='ticker'?'ticker':'tiles',installedRow:c.installedRow!==false,
    widgets:{today:Array.isArray(w.today)?w.today.map(String):[],weather:String(w.weather||''),game:String(w.game||''),news:Array.isArray(w.news)?w.news.map(String):[]},
    rows:(Array.isArray(c.rows)?c.rows:[]).map(function(r){return{id:String(r.id||uid()),name:String(r.name||'Row'),wall:WALLS[r.wall]?r.wall:'',
      tiles:(Array.isArray(r.tiles)?r.tiles:[]).map(function(t){return{id:String(t.id||uid()),label:String(t.label||'Tile'),url:String(t.url||''),color:hex(t.color,'#4f8cff'),kind:KINDS.indexOf(t.kind)>=0?t.kind:'web',pkg:String(t.pkg||'')}})}})};
}
function render(cfg,status){
  status=status||{};var w=cfg.widgets;
  var tk=cfg.showWidgets&&cfg.widgetStyle==='ticker';
  var h='<div class="tv-stage tv-bg-'+esc(cfg.bg)+(tk?' has-ticker':'')+'" style="--accent:'+esc(cfg.accent)+';--tw:'+(SIZES[cfg.size]||248)+'px" data-accent="'+esc(cfg.accent)+'" data-match="'+(cfg.matchAccent?1:0)+'">';
  if(WALLS[cfg.fx]&&WALLS[cfg.fx].video)h+='<video class="tv-vid" src="'+WALLS[cfg.fx].video+'" poster="'+WALLS[cfg.fx].poster+'" autoplay muted loop playsinline></video>';
  var used={};cfg.rows.forEach(function(r){if(cfg.rowWalls!==false&&r.wall&&!used[r.wall]){used[r.wall]=1;var W=WALLS[r.wall];h+='<div class="tv-wall" data-w="'+r.wall+'" style="background:'+W.bg+'">'+(W.video?'<video src="'+W.video+'" muted loop playsinline preload="none"></video>':'')+'</div>'}});
  h+='<div class="tv-glow"></div>';
  if(cfg.fx==='drift')h+='<div class="tv-drift"></div>';
  else if(cfg.fx==='snow'||cfg.fx==='stars')h+='<canvas class="tv-fx" data-fx="'+cfg.fx+'" width="640" height="360"></canvas>';
  if(cfg._gear)h+='<div class="tv-gear">&#9881; Theme</div>';
  h+='<div class="tv-top"><div><div class="tv-title">'+esc(cfg.title)+'</div><div class="tv-date">'+dateStr()+'</div></div><div class="tv-clock">'+timeStr()+'</div></div>';
  if(tk){
    var items=[];w.today.filter(function(x){return x.trim()}).forEach(function(x){items.push(['Today',x])});
    if(w.weather.trim())items.push(['Weather',w.weather]);if(w.game.trim())items.push(['Next game',w.game]);
    w.news.filter(function(x){return x.trim()}).forEach(function(x){var m=/^([^:]{1,18}):\s*(.+)$/.exec(x);items.push(m?[m[1],m[2]]:['',x])});
    if(!items.length)items.push(['','Add items in the sandbox to fill the ticker']);
    var one=items.map(function(it){return '<span class="tv-tk-it">'+(it[0]?'<i>'+esc(it[0])+'</i>':'')+esc(it[1])+'</span>'}).join('');
    var len=items.reduce(function(n,it){return n+it[0].length+it[1].length+6},0);
    h+='<div class="tv-ticker"><div class="tv-tk-tag">'+esc(cfg.title)+'<b class="tv-tk-clock">'+timeStr()+'</b></div><div class="tv-tk-win"><div class="tv-tk-run" style="animation-duration:'+Math.max(18,Math.round(len*.32))+'s">'+one+one+'</div></div></div>';
  }
  if(cfg.showWidgets&&!tk){
    var today=w.today.filter(function(x){return x.trim()}).slice(0,3);
    h+='<div class="tv-widgets"><div class="tv-w"><div class="tv-wl">Today</div>'+(today.length?today.map(function(x){return '<div class="tv-wi">'+esc(x)+'</div>'}).join(''):'<div class="tv-wi dim">Nothing scheduled</div>')+'</div>';
    h+='<div class="tv-w"><div class="tv-wl">Weather</div><div class="tv-big">'+esc(w.weather)+'</div></div>';
    h+='<div class="tv-w"><div class="tv-wl">Next game</div><div class="tv-big">'+esc(w.game)+'</div></div></div>';
  }
  h+='<div class="tv-rows'+(cfg.showWidgets?'':' nowidgets')+'">';
  cfg.rows.forEach(function(row,r){
    h+='<section class="tv-row" data-wall="'+row.wall+'"><h3>'+esc(row.name)+(status[row.id]==='new'?'<span class="tv-badge new">NEW</span>':'')+'</h3><div class="tv-track">';
    row.tiles.forEach(function(t,c){
      var st=status[t.id],off=cfg._browser&&t.kind!=='web'&&!/^https?:\/\/[^\/]/i.test(String(t.url).trim()||'');
