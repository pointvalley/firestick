plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pointvalley.firestick'
    compileSdk 34

    defaultConfig {
        applicationId 'com.pointvalley.firestick'
        minSdk 25
        targetSdk 34
        // CI passes the build number so every build installs as an update
        def buildNumber = System.getenv('VERSION_CODE') ?: '1'
        versionCode = buildNumber.toInteger()
        versionName = "1." + buildNumber
    }

    signingConfigs {
        // fixed key so new builds install over old ones on the Firestick
        home {
            storeFile file('firestick-home.keystore')
            storePassword 'firestickhome'
            keyAlias 'home'
            keyPassword 'firestickhome'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.home
        }
        debug {
            signingConfig signingConfigs.home
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
